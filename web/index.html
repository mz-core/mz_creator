<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mz_creator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-id-card" viewBox="0 0 24 24"><rect width="18" height="14" x="3" y="5" rx="2"/><circle cx="8" cy="10" r="2"/><path d="M6 15c.8-1.7 3.2-1.7 4 0M14 9h4M14 13h4M14 17h3"/></symbol>
    <symbol id="i-dna" viewBox="0 0 24 24"><path d="m10 16 1.5 1.5M14 8l-1.5-1.5M15 21a6 6 0 0 0-6-6M9 3a6 6 0 0 0 6 6M17 3a10 10 0 0 1-10 18M7 3a10 10 0 0 0 10 18"/><path d="M8 8h8M8 16h8"/></symbol>
    <symbol id="i-scan-face" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="11" r="3"/><path d="M8 18c1-2 7-2 8 0"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3-1.3 3.7L7 8l3.7 1.3L12 13l1.3-3.7L17 8l-3.7-1.3L12 3ZM5 14l-.8 2.2L2 17l2.2.8L5 20l.8-2.2L8 17l-2.2-.8L5 14ZM19 13l-.8 2.2L16 16l2.2.8L19 19l.8-2.2L22 16l-2.2-.8L19 13Z"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="m8.7 8.4 10.8 6.2M8.7 15.6 19.5 9.4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-beard" viewBox="0 0 24 24"><path d="M5 8c0 7 2.5 11 7 13 4.5-2 7-6 7-13M7 6c1.5 1 3 1.5 5 1.5S15.5 7 17 6M8 12c1 1 2.3 1.5 4 1.5s3-.5 4-1.5"/><path d="M9 3v3M15 3v3"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h1.4a1.6 1.6 0 0 0 1.2-2.7 1.6 1.6 0 0 1 1.2-2.7H18a3 3 0 0 0 3-3A9 9 0 0 0 12 3Z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/><circle cx="16.5" cy="11" r="1"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></symbol>
    <symbol id="i-shirt" viewBox="0 0 24 24"><path d="m8 4-5 3 2 5 3-1v9h8v-9l3 1 2-5-5-3c-.8 1-1.8 1.5-4 1.5S8.8 5 8 4Z"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect width="14" height="18" x="5" y="3" rx="2"/><path d="M9 3.5h6V6H9zM9 11l1.5 1.5L14 9M9 16h6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect width="18" height="17" x="3" y="4" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"/></symbol>
    <symbol id="i-mars" viewBox="0 0 24 24"><circle cx="9" cy="15" r="5"/><path d="m13 11 7-7M15 4h5v5"/></symbol>
    <symbol id="i-venus" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M12 13v8M9 18h6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-rotate-ccw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-rotate-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3c4 0 5 10 9 10h6M18 14l3 3-3 3M3 17h3c1.8 0 3-2.2 4.2-4.5M15 7h6M18 4l3 3-3 3"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h12l2 2v16H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  </svg>

  <main id="creator" class="creator" aria-hidden="true">
    <div class="screen-shade" aria-hidden="true"></div>

    <aside class="brand-rail" aria-label="Identidade do sistema">
      <div class="brand-mark" aria-label="MZ Core">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="3">
            <path d="M32 5 44 12v14L32 33 20 26V12Z"/>
            <path d="M20 26 8 33v14l12 7 12-7V33M44 26l12 7v14l-12 7-12-7"/>
          </g>
        </svg>
        <strong>MZ</strong><span>CORE</span>
      </div>
      <div class="brand-title">CHARACTER CREATOR</div>
      <div class="brand-status"><span></span>FiveM</div>
    </aside>

    <section class="radial-shell" aria-label="Etapas do criador">
      <svg class="radial-arcs" viewBox="0 0 650 1080" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="arcGlow" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#1df4aa" stop-opacity=".15"/>
            <stop offset=".48" stop-color="#31e6d0" stop-opacity=".9"/>
            <stop offset="1" stop-color="#1df4aa" stop-opacity=".2"/>
          </linearGradient>
        </defs>
        <path class="arc arc-outer" d="M30 1030 C160 815 100 245 390 5"/>
        <path class="arc arc-primary" d="M80 1015 C225 795 150 275 430 25"/>
        <path class="arc arc-inner" d="M145 975 C290 770 220 330 485 80"/>
        <path class="arc-progress" d="M80 1015 C225 795 150 275 430 25" pathLength="100"/>
        <g class="arc-ticks">
          <path d="M52 940h26M65 882h18M78 824h28M88 765h18M96 706h26M101 646h18M106 586h26M110 525h18M117 464h26M130 402h18M148 340h26M171 278h18M201 218h26M239 158h18M286 100h26"/>
        </g>
      </svg>
      <nav id="category-menu" class="category-menu"></nav>

      <div id="selected-category" class="selected-category" aria-live="polite">
        <div class="hex-frame hex-frame-back"></div>
        <div class="hex-frame hex-frame-mid"></div>
        <div class="hex-core">
          <svg class="hex-icon"><use href="#i-id-card"></use></svg>
          <strong>IDENTIDADE</strong>
          <span>Defina as informações básicas do personagem.</span>
        </div>
      </div>
    </section>

    <button id="close-button" class="icon-button close-button" type="button" aria-label="Fechar criador" title="Fechar">
      <svg><use href="#i-x"></use></svg>
    </button>

    <aside id="settings-panel" class="settings-panel" aria-label="Configurações do personagem">
      <div id="settings-content" class="settings-content"></div>
    </aside>

    <div class="camera-dock" aria-label="Controles de câmera">
      <span class="dock-caption">CÂMERA</span>
      <button id="rotate-left" class="dock-button" type="button" aria-label="Girar para esquerda" title="Girar para esquerda">
        <svg><use href="#i-rotate-ccw"></use></svg><small>GIRAR</small>
      </button>
      <button class="dock-button camera-button is-active" type="button" data-mode="face" aria-label="Câmera de rosto" title="Câmera de rosto">
        <svg><use href="#i-focus"></use></svg><small>ROSTO</small>
      </button>
      <button class="dock-button camera-button" type="button" data-mode="body" aria-label="Câmera de corpo" title="Câmera de corpo">
        <svg><use href="#i-maximize"></use></svg><small>CORPO</small>
      </button>
      <button id="rotate-right" class="dock-button" type="button" aria-label="Girar para direita" title="Girar para direita">
        <svg><use href="#i-rotate-cw"></use></svg><small>GIRAR</small>
      </button>
    </div>

    <footer class="action-dock">
      <button id="back-button" class="action-button action-secondary" type="button">
        <svg><use href="#i-chevron-left"></use></svg><span>VOLTAR</span>
      </button>
      <button id="random-button" class="action-button action-secondary" type="button">
        <svg><use href="#i-shuffle"></use></svg><span>RANDOMIZAR</span>
      </button>
      <button id="save-button" class="action-button action-primary" type="button">
        <svg><use href="#i-save"></use></svg><span>SALVAR PERSONAGEM</span><svg><use href="#i-chevron-right"></use></svg>
      </button>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
